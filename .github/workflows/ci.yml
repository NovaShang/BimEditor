name: CI

# The standalone app is no longer deployed (editor.bim-claw.com redirects to
# https://bim.jouledown.com/editor); CI only checks that it still builds.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Build App
        run: npm run build -w app
